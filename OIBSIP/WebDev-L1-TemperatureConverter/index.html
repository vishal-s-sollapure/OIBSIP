<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Responsive Temperature Converter using HTML, CSS and JavaScript">

    <title>Temperature Converter | Vishal S Sollapure</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="container">

            <h1>Temperature Converter</h1>

            <p>
                Convert temperatures quickly and accurately
            </p>

        </div>

    </header>


    <!-- Main -->
    <main class="main">

        <section class="converter-card">

            <div class="card-heading">

                <span class="icon">°</span>

                <h2>Temperature Converter</h2>

                <p>
                    Enter a temperature and select its unit
                    to see the equivalent values.
                </p>

            </div>


            <!-- Input -->
            <div class="form-group">

                <label for="temperature">
                    Enter Temperature
                </label>

                <input
                    type="number"
                    id="temperature"
                    placeholder="Enter temperature"
                    step="any"
                    autocomplete="off">

            </div>


            <!-- Unit -->
            <div class="form-group">

                <label for="unit">
                    Select Unit
                </label>

                <select id="unit">

                    <option value="celsius">
                        Celsius (°C)
                    </option>

                    <option value="fahrenheit">
                        Fahrenheit (°F)
                    </option>

                    <option value="kelvin">
                        Kelvin (K)
                    </option>

                </select>

            </div>


            <!-- Buttons -->
            <div class="buttons">

                <button
                    type="button"
                    id="convertBtn"
                    class="btn convert-btn">

                    Convert

                </button>

                <button
                    type="button"
                    id="resetBtn"
                    class="btn reset-btn">

                    Reset

                </button>

            </div>


            <!-- Error Message -->
            <p
                id="errorMessage"
                class="error-message"
                role="alert">
            </p>


            <!-- Results -->
            <div
                id="resultBox"
                class="result-box"
                aria-live="polite">

                <h3>Conversion Results</h3>

                <div class="result-item">

                    <span>
                        Celsius
                    </span>

                    <strong id="celsiusResult">
                        —
                    </strong>

                </div>


                <div class="result-item">

                    <span>
                        Fahrenheit
                    </span>

                    <strong id="fahrenheitResult">
                        —
                    </strong>

                </div>


                <div class="result-item">

                    <span>
                        Kelvin
                    </span>

                    <strong id="kelvinResult">
                        —
                    </strong>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 Vishal S Sollapure |
            Temperature Converter
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
